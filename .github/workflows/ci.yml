name: FSD Project CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check project files
        run: |
          test -f index.html
          test -f main.js
          test -f style.css
          test -f responsive.css
          test -f register.html
          echo "All required FSD project files are present."