apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsd-web-deployment
  labels:
    app: fsd-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fsd-web
  template:
    metadata:
      labels:
        app: fsd-web
    spec:
      containers:
        - name: fsd-web
          image: ghcr.io/skit-devops-2026/jobfsd-web:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always
